<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>파트너/채널 연락 관리</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%87%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#f5f6f8; --surface:#fff; --text:#111827; --muted:#6b7280; --line:#e5e7eb; --accent:#2563eb; --accent-text:#fff; --amber:#a15c07;
      font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif; color-scheme:light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0f141b; --surface:#171d26; --text:#e5e7eb; --muted:#9ca3af; --line:#2a3240; --accent:#4f8cf7; --accent-text:#0b1220; --amber:#f0b45b; color-scheme:dark; }
    }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; background:var(--bg); color:var(--text); font-size:15px; line-height:1.6; }
    main { width:min(520px, 100%); padding:32px 24px; background:var(--surface); border:1px solid var(--line); border-radius:12px; text-align:center; }
    h1 { margin:0 0 18px; font-size:19px; }
    .state { margin:0 0 6px; font-size:17px; font-weight:700; }
    .desc { margin:0 0 18px; color:var(--muted); }
    .off .state { color:var(--amber); }
    .spinner { width:22px; height:22px; margin:0 auto 12px; border:3px solid var(--line); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
    .off .spinner { display:none; }
    @keyframes spin { to { transform:rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation:none; } }
    button { padding:9px 18px; border-radius:8px; border:1px solid var(--accent); background:var(--accent); color:var(--accent-text); font:inherit; font-weight:700; cursor:pointer; }
    button:focus-visible { outline:3px solid rgba(37,99,235,.35); outline-offset:2px; }
    button[hidden] { display:none; }
    .checked { margin:12px 0 0; font-size:12.5px; color:var(--muted); }
  </style>
</head>
<body>
  <main id="box" aria-live="polite">
    <h1>📇 파트너/채널 연락 관리</h1>
    <div class="spinner" aria-hidden="true"></div>
    <p class="state" id="state">서버에 연결하는 중…</p>
    <p class="desc" id="desc">잠시만 기다려 주세요.</p>
    <button type="button" id="retry" hidden>다시 시도</button>
    <p class="checked" id="checked"></p>
  </main>
  <script>
    // 이 페이지는 입구만 한다: 서버 PC 가 켜져 있으면 그 PC 의 서버 주소로 옮겨 가고, 꺼져 있으면 안내만 한다.
    // 서버 주소(data/live.json)는 서버가 켜지면서 새 주소를 받을 때마다 저절로 바뀐다. 연락처 자료는 여기에 올리지 않는다.
    var RETRY_MS = 30000;
    var APP = 'partner-contacts';
    var box = document.getElementById('box');
    var stateEl = document.getElementById('state');
    var descEl = document.getElementById('desc');
    var retry = document.getElementById('retry');
    var checked = document.getElementById('checked');
    var timer = null;

    function withTimeout(ms) {
      var controller = new AbortController();
      setTimeout(function () { controller.abort(); }, ms);
      return controller.signal;
    }

    function serverAlive(url) {
      return fetch(new URL('api/ping', url), { cache: 'no-store', signal: withTimeout(5000) })
        .then(function (res) { return res.ok ? res.json() : null; })
        .then(function (data) { return Boolean(data && data.ok && data.app === APP); })
        .catch(function () { return false; });
    }

    // why: 'down' 서버 주소가 있는데 답이 없음 · 'closed' 서버 PC 설정에서 외부 접속을 꺼 둠(live.json serverUrl null — 2026-10-23 패널 T29) · 'never' 받은 주소가 없음
    function showOff(why) {
      box.className = 'off';
      stateEl.textContent = '지금은 접속할 수 없습니다';
      descEl.textContent = why === 'down'
        ? '서버 PC가 꺼져 있거나 켜지는 중입니다. 서버 PC가 켜지면 1~3분 안에 저절로 연결됩니다.'
        : why === 'closed'
          ? '서버 PC에서 외부 접속을 꺼 두었습니다. 다시 켜면 1~3분 안에 저절로 연결됩니다.'
          : '아직 서버 PC가 연결된 적이 없습니다. 서버 PC를 켜 주세요.';
      retry.hidden = false;
      var now = new Date();
      checked.textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0')
        + ' 확인 · 30초마다 다시 확인합니다';
    }

    function check() {
      clearTimeout(timer);
      fetch('data/live.json?t=' + Date.now(), { cache: 'no-store' })
        .then(function (res) { return res.ok ? res.json() : null; })
        .catch(function () { return null; })
        .then(function (live) {
          var url = live && live.serverUrl;
          if (!url) return showOff(live && live.serverUrl === null ? 'closed' : 'never');
          return serverAlive(url).then(function (alive) {
            if (alive) {
              stateEl.textContent = '서버로 이동합니다…';
              location.replace(new URL(location.hash || '', url).href); // 보던 화면 주소(#partners/people?…)도 그대로 넘긴다
            } else {
              showOff('down');
            }
          });
        })
        .then(function () { if (box.className === 'off') timer = setTimeout(check, RETRY_MS); });
    }

    retry.addEventListener('click', function () {
      box.className = '';
      stateEl.textContent = '서버에 연결하는 중…';
      descEl.textContent = '잠시만 기다려 주세요.';
      retry.hidden = true;
      check();
    });
    check();
  </script>
</body>
</html>
